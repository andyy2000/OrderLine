<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen · {{RESTAURANT_NAME}}</title>
<style>
  :root {
    --bg: #14120f; --panel: #1e1b17; --paper: #f6f1e7; --ink: #1b1813; --muted: #8b8478;
    --line: #2d2924; --new: #e0482f; --printed: #d99a2b; --ready: #3f9b5f; --accent: #f6f1e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--accent);
         font: 16px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .live.on .dot { background: var(--ready); }
  .spacer { flex: 1; }
  .pill { font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }
  .pill.ai-on { border-color: var(--ready); color: #9fe0b4; }
  .pill.ai-off { border-color: var(--new); color: #ffb3a6; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; }
  .ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 8px 14px; }
  main { padding: 20px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-items: start; }
  .empty { color: var(--muted); grid-column: 1 / -1; text-align: center; padding: 80px 0; font-size: 18px; }
  .ticket { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 16px 16px 14px;
            border-top: 8px solid var(--new); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .ticket.printed { border-top-color: var(--printed); }
  .ticket.ready { border-top-color: var(--ready); }
  .ticket.late { outline: 3px solid var(--new); animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { to { outline-color: transparent; } }
  .num { font: 700 26px/1 ui-monospace, "SF Mono", Menlo, monospace; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .pickup { font-weight: 700; font-size: 18px; }
  .who { color: #5d574d; font-size: 14px; margin: 4px 0 10px; }
  .status { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #5d574d; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px dashed #b9b1a3; }
  li { padding: 8px 0; border-bottom: 1px dashed #b9b1a3; }
  .qty { font: 700 18px ui-monospace, Menlo, monospace; display: inline-block; min-width: 28px; }
  .item { font-weight: 650; font-size: 18px; }
  .kn { color: #5d574d; margin-left: 28px; font-size: 16px; }
  .opt { margin-left: 28px; font-size: 15px; }
  .note { margin-left: 28px; font-size: 15px; font-weight: 700; color: #a12d17; }
  .total { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 700; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; padding: 12px; font-weight: 700; color: #fff; }
  .b-ready { background: var(--ready); }
  .b-done { background: #3b362f; }
  dialog { background: var(--panel); color: var(--accent); border: 1px solid var(--line); border-radius: 14px;
           width: min(560px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 12px; }
  .row small { color: var(--muted); display: block; }
  .switch { width: 54px; height: 30px; border-radius: 999px; background: #3b362f; position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--ready); }
  .switch[aria-checked="true"]::after { left: 27px; }
  .soldout .switch[aria-checked="true"] { background: var(--new); }
  input[type=number] { width: 80px; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); }
  .cat { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 2px; }
  .err { color: #ffb3a6; font-size: 14px; }
  #questions { display: grid; gap: 10px; padding: 16px 20px 0; }
  #questions:empty { display: none; }
  .question { background: #1f2a3a; border: 2px solid #5b8def; border-radius: 12px; padding: 14px 16px; }
  .question .q { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .question .q small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; }
  .quick button { background: #5b8def; color: #fff; padding: 12px 18px; font-weight: 700; font-size: 16px; }
  .quick button.alt { background: #3b362f; }
  .quick input { flex: 1; min-width: 180px; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); }
  .quick .mic.on { background: var(--new); }
  .timer { height: 4px; background: #5b8def; border-radius: 2px; margin-top: 10px; transition: width 1s linear; }
  #transfers { display: grid; gap: 10px; padding: 16px 20px 0; }
  #transfers:empty { display: none; }
  .transfer { background: #3a2f12; border: 1px solid var(--printed); border-radius: 10px; padding: 12px 14px; color: #ffe9b8; }
  .t-why { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .t-cart { margin-top: 6px; font-size: 15px; }
  header a { color: var(--muted); font-size: 13px; text-decoration: none; }
  @media (max-width: 600px) { main { padding: 12px; } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <h1>{{RESTAURANT_NAME}} · Phone orders</h1>
  <span class="live" id="live"><span class="dot"></span><span id="live-text">Connecting…</span></span>
  <span class="spacer"></span>
  <span class="pill" id="ai-pill">AI …</span>
  <a id="calls-link" href="#">Calls &amp; stats</a>
  <button class="ghost" id="open-settings">Owner controls</button>
</header>
<div id="questions"></div>
<div id="transfers"></div>
<main id="orders"><div class="empty">Waiting for orders…</div></main>

<dialog id="settings">
  <h2>Owner controls</h2>
  <div class="row">
    <div>AI answers the phone<small>Off = calls ring straight to the restaurant</small></div>
    <button class="switch" id="ai-switch" role="switch" aria-checked="false" aria-label="AI answers the phone"></button>
  </div>
  <div class="row">
    <div>Pickup wait (minutes)<small id="pickup-default"></small></div>
    <input type="number" id="pickup" min="5" max="120" step="5">
  </div>
  <div class="cat">Blocked numbers<small style="display:block;font-weight:normal">Prank callers. Block from the Calls page; tap to unblock.</small></div>
  <div id="blocked"></div>
  <div class="cat">Sold out tonight</div>
  <div id="soldout"></div>
  <p class="err" id="settings-err"></p>
  <div style="text-align:right;margin-top:14px"><button class="ghost" id="close-settings">Done</button></div>
</dialog>

<script>
const params = new URLSearchParams(location.search);
const rid = params.get("restaurant");
const token = params.get("token") || "";
const q = (extra = "") => `?restaurant=${encodeURIComponent(rid)}${token ? `&token=${encodeURIComponent(token)}` : ""}${extra}`;
const headers = { "Content-Type": "application/json", ...(token ? { "X-Admin-Token": token } : {}) };
const money = c => `$${(c / 100).toFixed(2)}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const timeOf = iso => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };

let seen = new Set();
let orders = [];
let first = true;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch (e) { /* audio blocked until first tap */ }
}

let questions = [];
function renderQuestions(list) {
  const box = document.getElementById("questions");
  const fresh = list.filter(q => !seen.has("q" + q.id));
  fresh.forEach(q => seen.add("q" + q.id));
  if (fresh.length) beep();
  questions = list;
  const open = new Set(list.map(q => String(q.id)));
  // keep banners being typed into; add new ones; remove answered/expired
  [...box.children].forEach(el => { if (!open.has(el.dataset.id)) el.remove(); });
  list.forEach(q => {
    if (box.querySelector(`[data-id="${q.id}"]`)) return;
    const el = document.createElement("div");
    el.className = "question"; el.dataset.id = q.id; el.dataset.expires = q.expires_at;
    el.innerHTML = `<div class="q">Caller asks: ${esc(q.question)}<small>answer in the next few seconds</small></div>
      <div class="quick">
        <button data-a="Yes">Yes</button><button data-a="No">No</button><button class="alt" data-a="Not today">Not today</button>
        <input type="text" placeholder="Type an answer…" aria-label="Answer">
        <button class="alt mic" title="Speak the answer">🎤</button><button class="alt send">Send</button>
      </div><div class="timer"></div>`;
    box.appendChild(el);
  });
  tickTimers();
}
function tickTimers() {
  document.querySelectorAll(".question").forEach(el => {
    const left = Math.max(0, Date.parse(el.dataset.expires) - Date.now());
    const total = 30000;
    el.querySelector(".timer").style.width = `${Math.min(100, 100 * left / total)}%`;
    if (left === 0) el.remove();
  });
}
setInterval(tickTimers, 1000);
async function answer(el, text) {
  text = (text || "").trim();
  if (!text) return;
  el.querySelectorAll("button, input").forEach(b => b.disabled = true);
  await fetch(`/api/questions/${el.dataset.id}/answer${q()}`, { method: "POST", headers, body: JSON.stringify({ answer: text }) });
  el.remove();
}
document.getElementById("questions").addEventListener("click", e => {
  const el = e.target.closest(".question"); if (!el) return;
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.a) return answer(el, b.dataset.a);
  if (b.classList.contains("send")) return answer(el, el.querySelector("input").value);
  if (b.classList.contains("mic")) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice input isn't supported in this browser; type the answer."); return; }
    const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
    b.classList.add("on");
    rec.onresult = ev => { el.querySelector("input").value = ev.results[0][0].transcript; b.classList.remove("on"); answer(el, ev.results[0][0].transcript); };
    rec.onerror = () => b.classList.remove("on");
    rec.onend = () => b.classList.remove("on");
    rec.start();
  }
});
document.getElementById("questions").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName === "INPUT") answer(e.target.closest(".question"), e.target.value);
});

function renderTransfers(transfers) {
  const box = document.getElementById("transfers");
  const fresh = transfers.filter(t => !seen.has("t" + t.call_id));
  fresh.forEach(t => seen.add("t" + t.call_id));
  if (!first && fresh.length) beep();
  box.innerHTML = transfers.map(t => {
    const lines = (t.cart && t.cart.lines || []).map(l => esc(l.description)).join(" · ");
    return `<div class="transfer"><strong>Call handed to you</strong> ${t.phone ? "from " + esc(t.phone) : ""} · ${timeOf(t.at)}
      ${t.reason ? `<div class="t-why">${esc(t.reason)}</div>` : ""}
      <div class="t-cart">${lines ? "Already ordered: " + lines : "Nothing ordered yet"}</div></div>`;
  }).join("");
}

function render() {
  const main = document.getElementById("orders");
  if (!orders.length) { main.innerHTML = '<div class="empty">No open orders.</div>'; return; }
  const now = Date.now();
  main.innerHTML = orders.slice().reverse().map(o => {
    const late = o.status === "confirmed" && now - Date.parse(o.created_at) > 30000;
    const lines = o.lines.map(l => `
      <li><span class="qty">${l.quantity}</span><span class="item">${esc(l.name)}${l.size ? ` (${esc(l.size)})` : ""}</span>
        ${l.kitchen_name ? `<div class="kn">${esc(l.kitchen_name)}</div>` : ""}
        ${l.options.map(x => `<div class="opt">– ${esc(x)}</div>`).join("")}
        ${(l.includes || []).length ? `<div class="opt">w/ ${esc(l.includes.join(", "))}</div>` : ""}
        ${l.notes ? `<div class="note">★ ${esc(l.notes)}</div>` : ""}</li>`).join("");
    const action = o.status === "ready"
      ? `<button class="b-done" data-id="${o.id}" data-status="picked_up">Picked up</button>`
      : `<button class="b-ready" data-id="${o.id}" data-status="ready">Ready</button>`;
    return `<article class="ticket ${o.status}${late ? " late" : ""}">
      <div class="meta"><span class="num">#${String(o.order_number).padStart(4, "0")}</span><span class="pickup">${timeOf(o.pickup_at)}</span></div>
      <div class="who">${esc(o.customer_name)} · ${esc(o.phone.replace(/(\d{3})(\d{3})(\d{4})/, "$1-$2-$3"))}
        <span class="status"> · ${o.status === "confirmed" ? "not printed" : esc(o.status)}</span></div>
      <ul>${lines}</ul>
      <div class="total"><span>Total · pay at pickup</span><span>${money(o.total_cents)}</span></div>
      <div class="actions">${action}</div>
    </article>`;
  }).join("");
}

document.getElementById("orders").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  b.disabled = true;
  await fetch(`/api/orders/${b.dataset.id}/status${q()}`, { method: "POST", headers, body: JSON.stringify({ status: b.dataset.status }) });
});

function connect() {
  const es = new EventSource(`/api/stream${q()}`);
  const live = document.getElementById("live"), text = document.getElementById("live-text");
  es.addEventListener("orders", ev => {
    live.classList.add("on"); text.textContent = "Live";
    const data = JSON.parse(ev.data);
    orders = Array.isArray(data) ? data : data.orders;
    renderTransfers(Array.isArray(data) ? [] : data.transfers || []);
    renderQuestions(Array.isArray(data) ? [] : data.questions || []);
    const fresh = orders.filter(o => !seen.has(o.id));
    fresh.forEach(o => seen.add(o.id));
    if (!first && fresh.length) beep();
    first = false;
    render();
  });
  es.onerror = () => { live.classList.remove("on"); text.textContent = "Reconnecting…"; };
}
setInterval(render, 5000); // re-check "late" tickets

// ---- owner controls ----
const dlg = document.getElementById("settings");
let settings = null, items = [];
async function loadSettings() {
  settings = await (await fetch(`/api/settings${q()}`, { headers })).json();
  const pill = document.getElementById("ai-pill");
  pill.textContent = settings.ai_enabled ? "AI answering" : "AI off · phone rings";
  pill.className = "pill " + (settings.ai_enabled ? "ai-on" : "ai-off");
  document.getElementById("ai-switch").setAttribute("aria-checked", settings.ai_enabled);
  document.getElementById("pickup").value = settings.pickup_minutes ?? settings.default_pickup_minutes;
  document.getElementById("pickup-default").textContent = `Normal: ${settings.default_pickup_minutes}`;
  renderSoldOut();
  renderBlocked();
}
function fmtPhone(d) { return d && d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : d; }
function renderBlocked() {
  const nums = settings.blocked_numbers || [];
  document.getElementById("blocked").innerHTML = nums.length
    ? nums.map(n => `<div class="row"><div>${esc(fmtPhone(n))}</div><button class="ghost" data-unblock="${esc(n)}">Unblock</button></div>`).join("")
    : '<div class="row"><small>None</small></div>';
}
function renderSoldOut() {
  let cat = "";
  document.getElementById("soldout").innerHTML = items.map(i => {
    const head = i.category !== cat ? `<div class="cat">${esc(cat = i.category)}</div>` : "";
    const on = settings.sold_out.includes(i.id);
    return `${head}<div class="row soldout"><div>${esc(i.name)}</div>
      <button class="switch" role="switch" aria-checked="${on}" data-item="${esc(i.id)}" aria-label="${esc(i.name)} sold out"></button></div>`;
  }).join("");
}
async function save(change) {
  const r = await fetch(`/api/settings${q()}`, { method: "POST", headers, body: JSON.stringify(change) });
  document.getElementById("settings-err").textContent = r.ok ? "" : (await r.json()).error;
  await loadSettings();
}
document.getElementById("ai-switch").onclick = () => save({ ai_enabled: !settings.ai_enabled });
document.getElementById("pickup").onchange = e => {
  const v = parseInt(e.target.value, 10);
  save({ pickup_minutes: v === settings.default_pickup_minutes ? null : v });
};
document.getElementById("soldout").onclick = e => {
  const b = e.target.closest("button[data-item]");
  if (!b) return;
  const set = new Set(settings.sold_out);
  set.has(b.dataset.item) ? set.delete(b.dataset.item) : set.add(b.dataset.item);
  save({ sold_out: [...set] });
};
document.getElementById("blocked").onclick = async e => {
  const b = e.target.closest("button[data-unblock]");
  if (!b) return;
  await fetch(`/api/block${q()}`, { method: "POST", headers, body: JSON.stringify({ phone: b.dataset.unblock, blocked: false }) });
  await loadSettings();
};
document.getElementById("open-settings").onclick = () => dlg.showModal();
document.getElementById("calls-link").href = "/calls" + q();
document.getElementById("close-settings").onclick = () => dlg.close();

(async () => {
  items = await (await fetch(`/api/menu${q()}`, { headers })).json();
  await loadSettings();
  connect();
})();
</script>
</body>
</html>
